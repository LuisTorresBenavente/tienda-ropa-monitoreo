apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: catalogo-service
  namespace: tienda-ropa
  labels:
    app: catalogo-service
spec:
  selector:
    matchLabels:
      app: catalogo-service
  namespaceSelector:
    matchNames:
      - tienda-ropa
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
